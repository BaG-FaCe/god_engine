    rateLimitPerMinute: 20
    dimensions: [geopolitical, logistics]
    description: Außenhandelsstatistik zwischen Herkunfts- und Zielland; plausibilisiert
      die Lieferkette und erkennt einseitige Abhängigkeiten.
    costNote: Kostenlos im Public-Preview-Tarif (120 Anfragen/Stunde).

  - key: ofac_sdn
    name: US Treasury OFAC SDN List
    tier: free
    category: customs
    class: FreeData::OfacSdnProvider
