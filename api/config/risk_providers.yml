# ---------------------------------------------------------------------------
# Catalogue of every supply chain risk data source the platform can use.
#
# This is DATA, not code, on purpose:
#   * `GET /api/v1/risk_providers` lists all of it, so an operator sees what the
#     platform is capable of - not only what is switched on
#   * adding a vendor is a data change (plus an optional mapping override), never
#     a change to the aggregation logic
#   * rate limits and cache TTLs live here, which is the only place where
#     "do not exhaust the free tier" is enforced
#
# `envKeys` documents which variables a source reads. A source counts as
# "configured" as soon as one of them is present - or immediately when
# `requiresApiKey` is false.
# ---------------------------------------------------------------------------
providers:
  # ============================ FREE / OPEN DATA ============================
  - key: world_bank_lpi
    name: World Bank Logistics Performance Index
    tier: free
    category: open_data
    class: FreeData::WorldBankLpiProvider
    docsUrl: https://lpi.worldbank.org/
    requiresApiKey: false
    cacheTtlMinutes: 1440
    rateLimitPerMinute: 30
    dimensions: [logistics]
    description: Logistics performance and customs/infrastructure scores per country.
    costNote: Kostenlos, keine Registrierung.

  - key: gdacs
    name: GDACS Disaster Alerts
    tier: free
    category: open_data
    class: FreeData::GdacsProvider
    docsUrl: https://www.gdacs.org/
    requiresApiKey: false
    cacheTtlMinutes: 30
    rateLimitPerMinute: 20
    dimensions: [weather, operational]
    description: EU/JRC disaster feed with alert levels for affected countries.
    costNote: Kostenlos.

  - key: usgs_earthquake
    name: USGS Earthquake Hazards
    tier: free
    category: open_data
    class: FreeData::UsgsEarthquakeProvider
    docsUrl: https://earthquake.usgs.gov/earthquakes/feed/v1.0/geojson.php
    requiresApiKey: false
    cacheTtlMinutes: 60
    rateLimitPerMinute: 60
    dimensions: [weather, operational]
    description: Real-time earthquake feed for production and port regions.
    costNote: Kostenlos.

  - key: open_meteo
    name: Open-Meteo Weather
    tier: free
    category: open_data
    class: FreeData::OpenMeteoProvider
    docsUrl: https://open-meteo.com/en/docs
    requiresApiKey: false
    cacheTtlMinutes: 120
    rateLimitPerMinute: 60
    dimensions: [weather, logistics]
    description: Forecast and severe weather signals for origin and destination.
    costNote: Kostenlos bis 10.000 Anfragen/Tag (nicht-kommerziell).

  - key: ecb_fx
    name: ECB / Frankfurter FX Rates
    tier: free
    category: open_data
    class: FreeData::EcbExchangeRateProvider
    docsUrl: https://frankfurter.dev/
    requiresApiKey: false
    cacheTtlMinutes: 720
    rateLimitPerMinute: 60
    dimensions: [financial]
    description: ECB reference rates and volatility as a currency risk proxy.
    costNote: Kostenlos.

  - key: eu_sanctions
    name: EU Consolidated Sanctions List
    tier: free
    category: customs
    class: FreeData::EuSanctionsProvider
    docsUrl: https://data.europa.eu/data/datasets/consolidated-list-of-persons-groups-and-entities-subject-to-eu-financial-sanctions
    requiresApiKey: false
    cacheTtlMinutes: 720
    rateLimitPerMinute: 10
    dimensions: [compliance, geopolitical]
    description: EU sanctions list, cached locally and matched against supplier names.
    costNote: Kostenlos, offene Daten der EU.

  - key: eu_taric
    name: EU TARIC Trade Measures
    tier: free
    category: customs
    class: FreeData::EuTaricProvider
    docsUrl: https://ec.europa.eu/taxation_customs/dds2/taric/taric_consultation.jsp
    requiresApiKey: false
    cacheTtlMinutes: 1440
    rateLimitPerMinute: 30
    dimensions: [customs, compliance]
    description: Duty rates, anti-dumping measures and import restrictions per HS code.
    costNote: Kostenlos.

  - key: port_congestion
    name: Open Port Congestion Indicators
    tier: free
    category: open_data
    class: FreeData::PortCongestionProvider
    docsUrl: https://www.unescap.org/our-work/transport/port-waiting-time-database
    requiresApiKey: false
    cacheTtlMinutes: 720
    rateLimitPerMinute: 30
    dimensions: [logistics, operational]
    description: Published port waiting-time statistics as a congestion proxy.
    costNote: Kostenlos (UNESCAP / World Bank).

  - key: freightos_fbx
    name: Freightos Baltic Index (FBX)
    tier: free
    category: open_data
    class: FreeData::FreightosFbxProvider
    docsUrl: https://www.freightos.com/global-freight-index/
    requiresApiKey: true
    envKeys: [FREIGHTOS_API_KEY]
    cacheTtlMinutes: 720
    rateLimitPerMinute: 20
    dimensions: [logistics, financial]
    description: Container spot rates per trade lane; early capacity-shortage indicator.
    costNote: Kostenloser Tarif mit Registrierung.

  - key: fred_economic
    name: FRED Economic Series (St. Louis Fed)
    tier: free
    category: financial
    class: FreeData::FredEconomicProvider
    docsUrl: https://fred.stlouisfed.org/docs/api/fred/
    requiresApiKey: true
    envKeys: [FRED_API_KEY]
    cacheTtlMinutes: 720
    rateLimitPerMinute: 60
    dimensions: [financial]
    description: Producer price and freight cost indices used for price-spike detection.
    costNote: Kostenloser API-Key, 120 Anfragen/Minute.

  - key: openweather_alerts
