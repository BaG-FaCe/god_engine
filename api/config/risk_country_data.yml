# UN M49 numeric codes used by the UN Comtrade public preview endpoint.
#
# Comtrade keys on numeric codes, not on ISO alpha-2, so this mapping is what
# turns `materials.risk_profile.origin_country` into a query parameter. It covers
# the trading partners that actually appear in European bill-of-materials data;
